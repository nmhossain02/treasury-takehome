name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e './packages/ocr[test]' -e './apps/cola-mock[test]' -e './apps/api[test]'
      - run: python -m pytest packages/ocr/tests apps/cola-mock/tests apps/api/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:test
      - run: pnpm web:build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f docker/api.Dockerfile -t label-verifier-api:ci .
      - run: docker build -f docker/cola-mock.Dockerfile -t label-verifier-cola-mock:ci .
      - run: docker build -f docker/web.Dockerfile -t label-verifier-web:ci .
