[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "label-verifier-api"
version = "0.1.0"
description = "Photo-first alcohol label verification prototype API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<13",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/label_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

