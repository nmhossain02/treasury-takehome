[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cola-mock"
version = "0.1.0"
description = "Synthetic COLA integration for the label verification prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/cola_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

