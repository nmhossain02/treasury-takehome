apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: label-verifier
  labels:
    app.kubernetes.io/name: label-verifier
    app.kubernetes.io/part-of: alcohol-label-verifier
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"api":["cola-mock"]}'
    spec:
      serviceAccountName: label-verifier-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 15
      containers:
        - name: api
          image: us-east1-docker.pkg.dev/PROJECT_ID/label-verifier/api@API_IMAGE_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: COLA_MOCK_BASE_URL
              value: http://localhost:8081
            - name: OCR_STRATEGIES
              value: tesseract
            - name: OCR_TESSERACT_PATH
              value: /usr/bin/tesseract
            - name: DEMO_SYNTHETIC_ONLY
              value: "true"
            - name: MAX_IMAGE_BYTES
              value: "1572864"
            - name: MAX_AGGREGATE_BYTES
              value: "12582912"
            - name: MAX_REQUEST_CONCURRENCY
              value: "1"
            - name: VERIFICATION_DEADLINE_MS
              value: "5000"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 3
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
        - name: cola-mock
          image: us-east1-docker.pkg.dev/PROJECT_ID/label-verifier/cola-mock@COLA_MOCK_IMAGE_DIGEST
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: "8081"
            - name: DEMO_SYNTHETIC_ONLY
              value: "true"
          resources:
            limits:
              # Multi-container Cloud Run uses the second-generation execution
              # environment, so fractional CPU is not available to this sidecar.
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8081
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 15
